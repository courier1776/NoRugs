
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norugs"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "Flask==3.1.1",
    "httpx==0.28.1",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.14,<3",
    "python-dotenv==1.1.1",
    "tenacity==9.1.2",
]

[project.scripts]
norugs-web = "norugs_scraper.web:run"
norugs-scrape = "norugs_scraper.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
