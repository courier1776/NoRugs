[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norugs"
version = "1.0.0"
description = "NoRugs cryptocurrency risk monitor, API, and data collector"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.1",
  "httpx==0.28.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-dotenv==1.1.1",
  "tenacity==9.1.2"
]

[project.scripts]
norugs-web = "norugs_scraper.web:run"
norugs-scrape = "norugs_scraper.main:run"

[tool.setuptools.packages.find]
where = ["src"]
