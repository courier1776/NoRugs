<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watchlist — NoRugs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/shell.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  .filter-row { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-5); flex-wrap: wrap; }
  .chip { font-family: var(--font-mono); font-size: var(--text-2xs); padding: var(--sp-2) var(--sp-4); border-radius: 20px; border: 1px solid var(--hairline); background: var(--paper-100); color: var(--text-secondary); }
  .chip.active { background: var(--ink-950); color: var(--paper-100); border-color: var(--ink-950); }
  .filter-search { margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); background: var(--paper-100); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3); }
  .filter-search svg { width: 15px; height: 15px; color: var(--ink-400); }
  .filter-search input { border: none; outline: none; background: transparent; font-family: var(--font-mono); font-size: var(--text-xs); width: 180px; }

  th.sortable { cursor: pointer; user-select: none; }
  th.sortable .sort-arrow { font-size: 9px; margin-left: 4px; opacity: 0.5; }

  .chain-pill { font-family: var(--font-mono); font-size: 10px; padding: 2px 7px; border-radius: 10px; background: var(--paper-300); color: var(--text-secondary); }
  .row-actions { display: flex; gap: var(--sp-2); justify-content: flex-end; }
  .row-actions button { background: none; border: none; color: var(--ink-400); padding: 4px; }
  .row-actions button:hover { color: var(--text-primary); }
  .row-actions svg { width: 16px; height: 16px; }

  .change-up { color: var(--blue-700); }
  .change-down { color: var(--risk-danger-700); }
</style>
</head>
<body class="modern-blue-ui">
<div class="app-shell">
  <aside class="rail" data-rail></aside>
  <div class="rail-scrim"></div>

  <div class="main-col">
    <header class="topbar" data-topbar></header>

    <main class="content">
      <div class="page-head">
        <div>
          <span class="page-eyebrow">Watchlist</span>
          <h1 class="page-title">18 tokens tracked</h1>
          <p class="page-sub">Sorted by risk score. Click any row for the full analysis.</p>
        </div>
        <a href="coin-analysis.html" class="btn btn-primary">+ Add token</a>
      </div>

      <div class="filter-row">
        <span class="chip active">All (18)</span>
        <span class="chip">Low risk (4)</span>
        <span class="chip">Elevated (7)</span>
        <span class="chip">High risk (7)</span>
        <div class="filter-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.8-4.8"/></svg>
          <input type="text" placeholder="Filter by name or ticker" />
        </div>
      </div>

      <div class="panel">
        <div class="panel-body tight">
          <table class="data-table">
            <thead>
              <tr>
                <th>Token</th>
                <th class="sortable">Risk score <span class="sort-arrow">▼</span></th>
                <th>Risk tier</th>
                <th>Chain</th>
                <th class="sortable">Price <span class="sort-arrow">▾</span></th>
                <th class="sortable">24h change <span class="sort-arrow">▾</span></th>
                <th class="sortable">Liquidity <span class="sort-arrow">▾</span></th>
                <th></th>
              </tr>
            </thead>
            <tbody id="watch-table-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/gauge.js"></script>
<script src="js/shell.js"></script>
<script src="js/app-data.js"></script>
<script>
  NoRugsShell.renderShell('watchlist.html');

  const body = document.getElementById('watch-table-body');
  const sorted = [...NoRugsData.watchlist].sort((a, b) => b.score - a.score);

  sorted.forEach(t => {
    const zone = NoRugsGauge.zoneFor(t.score);
    const badgeClass = t.score <= 39 ? 'badge-safe' : t.score <= 69 ? 'badge-caution' : 'badge-danger';
    const isUp = t.change.startsWith('+');
    const tr = document.createElement('tr');
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', () => window.location.href = 'coin-analysis.html');
    tr.innerHTML = `
      <td><div class="cell-asset">
        <div class="cell-asset-icon">${t.ticker.slice(0,2)}</div>
        <div><div class="cell-asset-name">${t.name}</div><div class="cell-asset-ticker">$${t.ticker}</div></div>
      </div></td>
      <td><span class="mini-score">${NoRugsGauge.buildGaugeSVG(t.score, { variant: 'mini', size: 28 })}${t.score}</span></td>
      <td><span class="badge-pill ${badgeClass}"><span class="dot"></span>${zone.name}</span></td>
      <td><span class="chain-pill">${t.chain}</span></td>
      <td class="mono">${t.price}</td>
      <td class="mono ${isUp ? 'change-up' : 'change-down'}">${t.change}</td>
      <td class="mono">${t.liquidity}</td>
      <td><div class="row-actions">
        <button title="Remove from watchlist" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
      </div></td>
    `;
    body.appendChild(tr);
  });
</script>
</body>
</html>
