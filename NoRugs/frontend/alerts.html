<!doctype html><html lang="en"><head><title>Alerts — NoRugs</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/shell.css"><link rel="stylesheet" href="css/components.css"><style>.page-grid{display:grid;gap:22px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--hairline);border-radius:24px;box-shadow:var(--shadow-sm);overflow:hidden}.head{padding:22px 24px;border-bottom:1px solid var(--hairline)}.head h2{margin:0;font-family:var(--font-display);color:var(--blue-950)}.head p{margin:6px 0 0;color:#6077a4;font:500 .74rem var(--font-mono);text-transform:uppercase;letter-spacing:.06em}.body{padding:24px}.control{width:100%;padding:13px 14px;border:1px solid var(--hairline);border-radius:10px;background:#fff;font:inherit}.row{display:flex;gap:12px;align-items:center}.row.wrap{flex-wrap:wrap}.metric small{display:block;color:#6077a4;font:500 .72rem var(--font-mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}.metric strong{font:800 1.45rem var(--font-display);color:var(--blue-950)}.empty{padding:28px;text-align:center;color:var(--text-secondary)}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px;border:1px solid var(--hairline);border-radius:16px}.muted{color:var(--text-secondary)}.positive{color:#15803d!important}.negative{color:#dc2626!important}.risk{font-weight:800}.risk.low{color:#16a34a}.risk.moderate{color:#ca8a04}.risk.high{color:#f97316}.risk.critical{color:#dc2626}.status{padding:10px 14px;border-radius:999px;background:var(--blue-50);font-weight:700;color:var(--blue-800)}button{cursor:pointer}@media(max-width:900px){.two,.three{grid-template-columns:1fr}} </style></head><body class="modern-blue-ui"><div class="app-shell"><aside class="rail" data-rail></aside><div class="rail-scrim"></div><div class="main-col"><header class="topbar" data-topbar></header><main class="content"><span class="page-eyebrow">Browser-based monitoring rules</span><h1 class="page-title">Risk and price alerts</h1><p class="page-sub">Create alert rules that are evaluated against the live NoRugs API while this page is open.</p><section class="page-grid two"><article class="card"><div class="head"><h2>Create alert</h2><p>Risk score or price threshold</p></div><div class="body"><form id="form" class="page-grid"><select id="coin" class="control"></select><select id="type" class="control"><option value="risk_above">Risk score rises above</option><option value="price_above">Price rises above</option><option value="price_below">Price falls below</option></select><input id="threshold" class="control" type="number" min="0" step="any" placeholder="Threshold" required><button class="btn btn-primary">Create alert</button></form></div></article><article class="card"><div class="head"><h2>Alert status</h2><p>Evaluated every 15 seconds</p></div><div class="body page-grid two"><div class="metric"><small>Rules</small><strong id="rule-count">0</strong></div><div class="metric"><small>Triggered</small><strong id="trigger-count">0</strong></div></div></article></section><section class="card" style="margin-top:22px"><div class="head"><h2>Active rules</h2><p>Saved locally in this browser</p></div><div class="body"><div id="rules" class="list"></div></div></section></main></div></div><script src="js/shell.js"></script><script src="js/api.js"></script><script>(()=>{NoRugsShell.renderShell('alerts.html');let coins=[],rules=JSON.parse(localStorage.getItem('norugsAlerts')||'[]');const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD',maximumSignificantDigits:7});function save(){localStorage.setItem('norugsAlerts',JSON.stringify(rules))}function evaluate(r,c){const risk=Number(c.overall_risk_score)||0,price=Number(c.price_usd)||0;return r.type==='risk_above'?risk>r.threshold:r.type==='price_above'?price>r.threshold:price<r.threshold}function render(){let triggered=0;$('rules').innerHTML=rules.length?rules.map((r,i)=>{const c=coins.find(x=>String(x.symbol).toUpperCase()===r.symbol)||{},hit=evaluate(r,c);if(hit)triggered++;const label=r.type==='risk_above'?`Risk above ${r.threshold}`:r.type==='price_above'?`Price above ${money(r.threshold)}`:`Price below ${money(r.threshold)}`;return `<div class="item"><div><strong>${c.name||r.symbol} · ${label}</strong><div class="muted">Current: ${r.type==='risk_above'?Math.round(Number(c.overall_risk_score)||0):money(c.price_usd)} · <span class="risk ${hit?'critical':'low'}">${hit?'TRIGGERED':'Monitoring'}</span></div></div><button class="btn btn-secondary" data-remove="${i}">Delete</button></div>`}).join(''):'<div class="empty">No alert rules created.</div>';$('rule-count').textContent=rules.length;$('trigger-count').textContent=triggered;$('rules').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{rules.splice(Number(b.dataset.remove),1);save();render()})}async function load(){coins=await NoRugsApi.getCoins();$('coin').innerHTML=coins.slice().sort((a,b)=>(a.market_rank||9999)-(b.market_rank||9999)).map(c=>`<option value="${String(c.symbol).toUpperCase()}">${c.name} (${String(c.symbol).toUpperCase()})</option>`).join('');render();NoRugsShell.setEngineStatus('Live alert evaluation connected',true)}$('form').onsubmit=e=>{e.preventDefault();rules.push({symbol:$('coin').value,type:$('type').value,threshold:Number($('threshold').value)});save();$('threshold').value='';render()};load().catch(e=>NoRugsShell.setEngineStatus(e.message,false));setInterval(load,15000)})();</script></body></html>
