<!doctype html><html lang="en"><head><title>Watchlist — NoRugs</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/shell.css"><link rel="stylesheet" href="css/components.css"><style>.page-grid{display:grid;gap:22px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--hairline);border-radius:24px;box-shadow:var(--shadow-sm);overflow:hidden}.head{padding:22px 24px;border-bottom:1px solid var(--hairline)}.head h2{margin:0;font-family:var(--font-display);color:var(--blue-950)}.head p{margin:6px 0 0;color:#6077a4;font:500 .74rem var(--font-mono);text-transform:uppercase;letter-spacing:.06em}.body{padding:24px}.control{width:100%;padding:13px 14px;border:1px solid var(--hairline);border-radius:10px;background:#fff;font:inherit}.row{display:flex;gap:12px;align-items:center}.row.wrap{flex-wrap:wrap}.metric small{display:block;color:#6077a4;font:500 .72rem var(--font-mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}.metric strong{font:800 1.45rem var(--font-display);color:var(--blue-950)}.empty{padding:28px;text-align:center;color:var(--text-secondary)}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px;border:1px solid var(--hairline);border-radius:16px}.muted{color:var(--text-secondary)}.positive{color:#15803d!important}.negative{color:#dc2626!important}.risk{font-weight:800}.risk.low{color:#16a34a}.risk.moderate{color:#ca8a04}.risk.high{color:#f97316}.risk.critical{color:#dc2626}.status{padding:10px 14px;border-radius:999px;background:var(--blue-50);font-weight:700;color:var(--blue-800)}button{cursor:pointer}@media(max-width:900px){.two,.three{grid-template-columns:1fr}} </style></head><body class="modern-blue-ui"><div class="app-shell"><aside class="rail" data-rail></aside><div class="rail-scrim"></div><div class="main-col"><header class="topbar" data-topbar></header><main class="content"><span class="page-eyebrow">Personal live monitoring</span><h1 class="page-title">Watchlist</h1><p class="page-sub">Save assets and monitor their current market values and risk scores.</p><section class="card"><div class="body row wrap"><select id="coin" class="control" style="flex:1"></select><button id="add" class="btn btn-primary">Add to watchlist</button><span class="status" id="refresh-status">Refreshing every 15 seconds</span></div></section><section class="card" style="margin-top:22px"><div class="head"><h2>Tracked assets</h2><p>Saved locally in this browser</p></div><div class="body"><div id="list" class="list"></div></div></section></main></div></div><script src="js/shell.js"></script><script src="js/api.js"></script><script>(()=>{NoRugsShell.renderShell('watchlist.html');let coins=[],saved=JSON.parse(localStorage.getItem('norugsWatchlist')||'["BTC","ETH"]');const $=id=>document.getElementById(id),money=n=>n==null?'—':Number(n).toLocaleString('en-US',{style:'currency',currency:'USD',maximumSignificantDigits:7}),riskClass=s=>s<25?'low':s<50?'moderate':s<75?'high':'critical';function store(){localStorage.setItem('norugsWatchlist',JSON.stringify(saved))}function render(){const rows=saved.map(sym=>coins.find(c=>String(c.symbol).toUpperCase()===sym)).filter(Boolean);$('list').innerHTML=rows.length?rows.map(c=>{const s=Number(c.overall_risk_score)||0,ch=Number(c.price_change_24h_pct);return `<div class="item"><div><strong>${c.name} (${String(c.symbol).toUpperCase()})</strong><div class="muted">${money(c.price_usd)} · <span class="${ch>=0?'positive':'negative'}">${Number.isFinite(ch)?`${ch>=0?'+':''}${ch.toFixed(2)}%`:'—'}</span> · <span class="risk ${riskClass(s)}">Risk ${Math.round(s)}</span></div></div><div><a class="btn btn-secondary" href="coin-analysis.html?symbol=${c.symbol}">Analyze</a> <button class="btn btn-secondary" data-remove="${c.symbol}">Remove</button></div></div>`}).join(''):'<div class="empty">Your watchlist is empty.</div>';$('list').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{saved=saved.filter(s=>s!==b.dataset.remove);store();render()})}async function load(){coins=await NoRugsApi.getCoins();$('coin').innerHTML=coins.slice().sort((a,b)=>(a.market_rank||9999)-(b.market_rank||9999)).map(c=>`<option value="${String(c.symbol).toUpperCase()}">${c.name} (${String(c.symbol).toUpperCase()})</option>`).join('');render();$('refresh-status').textContent='Updated '+new Date().toLocaleTimeString();NoRugsShell.setEngineStatus('Live watchlist connected',true)}$('add').onclick=()=>{const s=$('coin').value;if(!saved.includes(s))saved.push(s);store();render()};load().catch(e=>NoRugsShell.setEngineStatus(e.message,false));setInterval(load,15000)})();</script></body></html>
