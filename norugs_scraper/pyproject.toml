[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "norugs-scraper"
version = "0.1.0"
description = "API-first cryptocurrency data ingestion for NoRugs"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-dotenv==1.1.1",
  "tenacity==9.1.2"
]

[project.scripts]
norugs-scrape = "norugs_scraper.main:run"

[tool.setuptools.packages.find]
where = ["src"]
